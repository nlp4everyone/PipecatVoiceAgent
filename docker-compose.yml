name: voice-agent

x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
  image: ${IMAGE:-voice-agent}:${TAG:-latest}
  env_file:
    - .env
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # Production-style container: the pipecat-base HTTP server (FastAPI) that
  # Pipecat Cloud talks to. POST /bot starts a session, /livez + /readyz are probes.
  agent:
    <<: *common
    container_name: voice-agent
    environment:
      PORT: ${PORT:-8080}
      PIPECAT_LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request;urllib.request.urlopen(f'http://127.0.0.1:{os.environ.get(\"PORT\",\"8080\")}/livez')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Local dev: the Pipecat dev runner with the prebuilt WebRTC test UI at
  # http://localhost:7860/client. Source is bind-mounted so edits are live.
  #   docker compose --profile dev up dev
  dev:
    <<: *common
    container_name: voice-agent-dev
    profiles: ["dev"]
    restart: "no"
    command: ["python", "bot.py", "--host", "0.0.0.0", "--port", "7860", "-t", "${TRANSPORT:-webrtc}"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    ports:
      - "7860:7860"
    volumes:
      - ./voice_agent:/app/voice_agent:ro
      - ./bot.py:/app/bot.py:ro
